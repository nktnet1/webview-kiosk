import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.artifacts.VersionCatalogsExtension
import org.gradle.api.attributes.Bundling
import org.gradle.api.attributes.Category
import org.gradle.api.attributes.java.TargetJvmEnvironment

// Resolve the artifacts needed for engine JVM, Android/Robolectric tests, and lint.
// This init script deliberately registers no dependency on a build or test task.
gradle.beforeProject { project ->
    if (project.path == ':') {
        project.tasks.register('resolveFormattingAssets') {
            group = 'help'
            description = 'Download formatter and brace-check dependencies only.'
            doLast {
                def libraries = project.extensions
                    .getByType(VersionCatalogsExtension).named('libs')
                def formatter = project.configurations.detachedConfiguration(
                    libraries.findLibrary('ktfmt').get().get()
                )
                formatter.attributes {
                    attribute(Category.CATEGORY_ATTRIBUTE,
                        project.objects.named(Category, Category.LIBRARY))
                    attribute(Bundling.BUNDLING_ATTRIBUTE,
                        project.objects.named(Bundling, Bundling.EXTERNAL))
                    attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                        project.objects.named(TargetJvmEnvironment,
                            TargetJvmEnvironment.STANDARD_JVM))
                }
                def braces = project.configurations.getByName('kotlinBraces')
                [formatter, braces].each { configuration ->
                    def files = configuration.incoming.artifacts.artifactFiles.files
                    logger.lifecycle(
                        "Resolved formatting tools: ${files.size()} files"
                    )
                }
            }
        }
    }
    if (project.path in [':app', ':adblock']) {
        def engine = project.path == ':adblock'
        project.tasks.register('resolveAndroidTestAssets') {
            group = 'help'
            description = 'Download JVM test dependencies without compiling or running tests.'
            if (!engine) {
                dependsOn(':adblock:resolveAndroidTestAssets')
                dependsOn(':resolveFormattingAssets')
            }

            doLast {
                def required = engine ? [
                    'compileClasspath',
                    'runtimeClasspath',
                    'testCompileClasspath',
                    'testRuntimeClasspath',
                ] : [
                    'debugCompileClasspath',
                    'debugRuntimeClasspath',
                    'debugUnitTestCompileClasspath',
                    'debugUnitTestRuntimeClasspath',
                    // AGP supplies lint through this separate configuration.
                    // It is not downloaded by the test classpaths above.
                    'androidLintTool',
                ]
                // Kotlin compiler/compiler-plugin configurations are resolved
                // lazily during compilation. Pre-fetch them for offline tests,
                // without executing a Kotlin or Android compile task.
                def optional = [
                    'kotlinCompilerClasspath',
                    'kotlinCompilerPluginClasspath',
                    'kotlinCompilerPluginClasspathMain',
                    'kotlinCompilerPluginClasspathTest',
                    'kotlinCompilerPluginClasspathDebug',
                    'kotlinCompilerPluginClasspathDebugUnitTest',
                    'lintChecks',
                    'debugLintChecksClasspath',
                    'releaseLintChecksClasspath',
                ]
                (required + optional).each { configurationName ->
                    def configuration = project.configurations.findByName(configurationName)
                    if (configuration == null || !configuration.canBeResolved) {
                        if (required.contains(configurationName)) {
                            throw new GradleException(
                                "Cannot resolve required configuration: ${configurationName}"
                            )
                        }
                        return
                    }
                    // Resolve artifact files, not just the dependency graph: the
                    // latter does not download the JARs/AARs needed offline.
                    // Android unit-test configurations include a dependency on the
                    // application project itself. Resolving that project as a
                    // library is ambiguous with AGP 9.4.x; the exporter only
                    // needs external artifacts, not the app's build outputs.
                    // The JVM engine has only external dependencies. Resolve its
                    // original configuration so Kotlin's lazy stdlib defaults and
                    // version alignment are retained by the exporter.
                    def externalOnly = engine ? configuration :
                        configuration.copyRecursive { dependency ->
                            !(dependency instanceof ProjectDependency)
                        }
                    def files = externalOnly.incoming.artifacts.artifactFiles.files
                    if (!engine && configurationName == 'androidLintTool' &&
                        !files.any { it.name.startsWith('lint-gradle-') && it.name.endsWith('.jar') }) {
                        throw new GradleException('Android lint-gradle JAR was not resolved')
                    }
                    logger.lifecycle(
                        "Resolved ${project.path}:${configurationName}: ${files.size()} files"
                    )
                }
                if (!engine) {
                    def libraries = project.extensions
                        .getByType(VersionCatalogsExtension).named('libs')
                    def agpVersion = libraries.findVersion('agp').get().requiredVersion
                    def kotlinVersion = libraries.findVersion('kotlin').get().requiredVersion
                    // AAPT2 has a separate build-number suffix, so fail loudly
                    // when AGP is bumped until the exporter pin is updated.
                    if (agpVersion != '9.5.0') {
                        throw new GradleException(
                            "Update pinned AAPT2 for AGP ${agpVersion} before exporting assets"
                        )
                    }
                    if (kotlinVersion != '2.4.21') {
                        throw new GradleException(
                            "Update pinned Compose group mapping for Kotlin ${kotlinVersion} before exporting assets"
                        )
                    }
                    // AGP and Kotlin resolve these outside the ordinary test
                    // configurations, during resource and Compose compilation.
                    [
                        'com.android.tools.build:aapt2:9.5.0-16666295:linux',
                        'org.jetbrains.kotlin:compose-group-mapping:2.4.21',
                    ].each { coordinate ->
                        def configuration = project.configurations.detachedConfiguration(
                            project.dependencies.create(coordinate)
                        )
                        def files = configuration.incoming.artifacts.artifactFiles.files
                        if (files.isEmpty()) {
                            throw new GradleException("Missing offline build asset: ${coordinate}")
                        }
                        logger.lifecycle("Resolved offline build asset ${coordinate}: ${files.size()} files")
                    }
                }
            }
        }
    }
}
