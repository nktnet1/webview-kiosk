[versions]
agp = "9.4.1"
androidRetrofix = "1.1.0"
androidRetrostreams = "1.7.4"
biometric = "1.1.0"
connector = "3.3.5"
dhizukuApi = "2.6.0"
detekt = "1.23.8"
hiddenapibypass = "6.2"
hivemqMqttClient = "1.4.1"
junit = "4.13.2"
kotlin = "2.4.21"
ktfmt = "0.64"
kotlinSerializationPlugin = "2.4.21"
kotlinxSerializationJson = "1.12.0"
okhttp = "5.5.1"
reorderable = "3.1.0"
re2j = "1.8"
robolectric = "4.17"
swiperefreshlayout = "1.2.0"
spotless = "8.10.4"

#noinspection GradleDependency
activityCompose = "1.11.0"
#noinspection GradleDependency
appcompat = "1.7.1"
#noinspection GradleDependency
composeBom = "2025.11.01"
#noinspection GradleDependency
coreKtx = "1.17.0"
#noinspection GradleDependency
lifecycleRuntimeKtx = "2.9.4"
#noinspection GradleDependency
navigationCompose = "2.9.8"
#noinspection GradleDependency
webkit = "1.14.0"

[libraries]
android-retrofuture = { module = "net.sourceforge.streamsupport:android-retrofuture", version.ref = "androidRetrostreams" }
android-retrostreams = { module = "net.sourceforge.streamsupport:android-retrostreams", version.ref = "androidRetrostreams" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
connector = { module = "org.unifiedpush.android:connector", version.ref = "connector" }
dhizuku-api = { module = "io.github.iamr0s:Dhizuku-API", version.ref = "dhizukuApi" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
hivemq-mqtt-client = { module = "com.hivemq:hivemq-mqtt-client", version.ref = "hivemqMqttClient" }
hivemq-mqtt-client-websocket = { module = "com.hivemq:hivemq-mqtt-client-websocket", version.ref = "hivemqMqttClient" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
junit = { module = "junit:junit", version.ref = "junit" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
# Used indirectly by scripts/resolve-android-test-assets.init.gradle.
#noinspection UnusedVersionCatalogEntry
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-retrofix = { id = "com.github.sgtsilvio.gradle.android-retrofix", version.ref = "androidRetrofix" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinSerializationPlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
