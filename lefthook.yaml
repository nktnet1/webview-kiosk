pre-commit:
  parallel: true
  commands:
    kotlin-format:
      glob: "*.{kt,kts}"
      run: sh gradlew checkFormatting
    android-lint:
      glob: "*.{kt,kts,java,xml,toml,properties}"
      run: ./gradlew lint --warning-mode=all
    typecheck:
      root: "docs/"
      glob: "*.{ts,cts,mts}"
      run: >
        pnpm typecheck
    check:
      root: "docs/"
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: >
        pnpm check
        --error-on-warnings
        --no-errors-on-unmatched
        --files-ignore-unknown=true
        {staged_files}
