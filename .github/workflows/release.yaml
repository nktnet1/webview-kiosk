name: Release APK

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # A tag must pass the same checks as a PR. These jobs check out the tagged
  # commit; green tests on main from an earlier commit are not sufficient.
  verify:
    name: Required test matrix
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yaml

  build:
    name: Build release and debug APKs
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Release signing secret is missing" >&2; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Build release and debug APKs
        run: sh gradlew :app:assembleRelease :app:assembleDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Store release APK for publication
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 7

      - name: Store debug APK for publication
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: [verify, build]
    # workflow_dispatch on a branch can exercise the release build without
    # accidentally creating a release named "main".
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download built release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/

      - name: Download built debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/

      - name: Rename APK and select changelog
        run: |
          VERSION_NAME="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          VERSION_CODE="$(jq -r '.elements[0].versionCode' app/build/outputs/apk/release/output-metadata.json)"
          test "$VERSION_NAME" != null && test "$VERSION_CODE" != null
          echo "Version name: $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat app/build/outputs/apk/release/output-metadata.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/WebviewKiosk_v$VERSION_NAME.apk"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [ ! -f "metadata/en-US/changelogs/$VERSION_CODE.txt" ]; then
            touch "metadata/en-US/changelogs/$VERSION_CODE.txt"
          fi

      - name: Create Draft GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          bodyFile: metadata/en-US/changelogs/${{ env.VERSION_CODE }}.txt
          artifacts: app/build/outputs/apk/release/*.apk,app/build/outputs/apk/debug/app-debug.apk
          artifactErrorsFailBuild: true
          draft: true
