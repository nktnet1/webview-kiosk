name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: "tests-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android:
    name: Android JVM and Robolectric tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js for cosmetic script tests
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify CI scripts, test assets, and cosmetic filtering
        run: sh scripts/ci/test-local.sh checks

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Gradle's build cache must be enabled in Gradle itself as well as saved
      # between runners. Trusted same-repository PRs can warm their own cache.
      - name: Configure Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Check Kotlin formatting and if/else braces
        run: sh gradlew checkFormatting --build-cache --stacktrace

      - name: Run unit tests
        run: sh gradlew :adblock:test :app:testDebugUnitTest --build-cache --profile --stacktrace

      # smokeRelease has release R8/shrinking but uses Android's test-only debug
      # signing key. No production keystore or emulator is needed. On release
      # tags, release.yaml checks the actual APK instead of rebuilding here.
      - name: Audit optimised release DEX and R8 diagnostics (test signing)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python3 scripts/r8_audit.py --require-mapping --json build/reports/r8/smokeRelease.json

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-results
          path: |
            adblock/build/test-results/test/
            adblock/build/reports/tests/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            build/reports/profile/
            build/reports/r8/smokeRelease.json
          if-no-files-found: ignore
