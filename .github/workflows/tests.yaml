name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: "tests-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android:
    name: Android JVM and Robolectric tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Android test-asset exporter dispatch and archive limits
        run: bash scripts/tests/export-android-test-assets.test.sh

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Gradle's build cache must be enabled in Gradle itself as well as saved
      # between runners. Trusted same-repository PRs can warm their own cache.
      - name: Configure Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Verify Android test report diagnostics
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run unit tests
        run: sh gradlew :app:testDebugUnitTest --build-cache --profile --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            build/reports/profile/
          if-no-files-found: ignore

  emulator:
    name: Android APK instrumentation (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # API 23 validates the Android 6-specific task path; API 35 exercises a
        # modern WebView provider and the installed, Retrofix-rewritten APK.
        include:
          - api: 23
            image: default
            arch: x86
          - api: 35
            image: google_apis
            arch: x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Gradle's build cache must be enabled in Gradle itself as well as saved
      # between runners. Trusted same-repository PRs can warm their own cache.
      - name: Configure Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Enable hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      # Build a clean boot snapshot without the application installed. AVDs are
      # segregated by API, system image, architecture and hardware profile.
      # Change avd-v1 when the emulator/image configuration is intentionally
      # changed. Cache misses perform one extra boot to seed later runs.
      - name: Restore clean Android emulator snapshot
        id: avd-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v1-${{ runner.os }}-${{ matrix.api }}-${{ matrix.image }}-${{ matrix.arch }}-pixel_2

      - name: Create clean emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo 'Clean emulator snapshot prepared'

      # Save before installing the test APK so failed tests cannot pollute the
      # cached image. The cache is only an optimisation, not a test requirement.
      - name: Cache clean emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Run installed-APK tests
        id: instrumented_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh scripts/ci/run-android-instrumentation.sh

      - name: Print instrumentation failures
        if: ${{ failure() && steps.instrumented_tests.outcome == 'failure' }}
        run: python3 scripts/ci/report_android_instrumentation.py

      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-results-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            build/reports/profile/
          if-no-files-found: ignore

  docs:
    name: Docs unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Setup Node.js and cache pnpm store
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  docs-browser:
    name: Docs browser E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Setup Node.js and cache pnpm store
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run QR browser tests
        run: pnpm test:e2e

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-results
          path: |
            docs/playwright-report/
            docs/test-results/
          if-no-files-found: ignore
