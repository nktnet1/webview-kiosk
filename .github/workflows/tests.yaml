name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: "tests-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android:
    name: Android JVM and Robolectric tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Android test-asset exporter dispatch and archive limits
        run: bash scripts/tests/export-android-test-assets.test.sh

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Gradle's build cache must be enabled in Gradle itself as well as saved
      # between runners. Trusted same-repository PRs can warm their own cache.
      - name: Configure Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Verify Android test report diagnostics
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run unit tests
        run: sh gradlew :app:testDebugUnitTest --build-cache --profile --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            build/reports/profile/
          if-no-files-found: ignore

  docs:
    name: Docs unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Setup Node.js and cache pnpm store
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck documentation
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

  docs-browser:
    name: Docs browser E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Setup Node.js and cache pnpm store
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm build

      - name: Run QR browser tests
        run: pnpm test:e2e

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-results
          path: |
            docs/playwright-report/
            docs/test-results/
          if-no-files-found: ignore
