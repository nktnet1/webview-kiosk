name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: "tests-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android:
    name: Android JVM and Robolectric tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Android test-asset exporter dispatch and archive limits
        run: bash scripts/tests/export-android-test-assets.test.sh

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Gradle's build cache must be enabled in Gradle itself as well as saved
      # between runners. Trusted same-repository PRs can warm their own cache.
      - name: Configure Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Verify Android test report diagnostics
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Verify native build task configuration-cache compatibility
        # Dry-run never needs Rust or the NDK; it still serializes the native task.
        # A second invocation verifies that Gradle can reuse the stored task graph.
        run: |
          sh gradlew :app:buildNativeAdblock --configuration-cache --dry-run
          sh gradlew :app:buildNativeAdblock --configuration-cache --dry-run

      - name: Run unit tests
        run: sh gradlew :app:testDebugUnitTest --build-cache --profile --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            build/reports/profile/
          if-no-files-found: ignore
