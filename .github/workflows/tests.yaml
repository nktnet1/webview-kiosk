name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run unit tests
        run: sh gradlew :app:testDebugUnitTest --stacktrace

  docs:
    name: Docs unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
