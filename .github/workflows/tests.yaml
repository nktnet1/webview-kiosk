name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: "tests-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  native-adblock:
    name: Native filter parser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup host Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test native parsing, validation, and matching
        # Run from the repo root: host tests need neither the NDK nor Android targets.
        run: cargo test --manifest-path app/native-adblock/Cargo.toml

  android:
    name: Android JVM and Robolectric tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js for cosmetic script tests
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify CI scripts, test assets, and cosmetic filtering
        run: sh scripts/ci/test-local.sh checks

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Gradle's build cache must be enabled in Gradle itself as well as saved
      # between runners. Trusted same-repository PRs can warm their own cache.
      - name: Configure Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Verify native build task configuration-cache compatibility
        # Dry-run never needs Rust or the NDK; it still serializes the native task.
        # A second invocation verifies that Gradle can reuse the stored task graph.
        run: |
          sh gradlew :app:buildNativeAdblock --configuration-cache --dry-run
          sh gradlew :app:buildNativeAdblock --configuration-cache --dry-run

      - name: Run unit tests
        run: sh gradlew :app:testDebugUnitTest --build-cache --profile --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            build/reports/profile/
          if-no-files-found: ignore
