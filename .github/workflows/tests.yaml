name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: "tests-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android:
    name: Android JVM and Robolectric tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Android test-asset exporter dispatch and archive limits
        run: bash scripts/tests/export-android-test-assets.test.sh

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run unit tests
        run: sh gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  emulator:
    name: Android APK instrumentation (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # API 23 validates the Android 6-specific task path; API 35 exercises a
        # modern WebView provider and the installed, Retrofix-rewritten APK.
        include:
          - api: 23
            image: default
            arch: x86
          - api: 35
            image: google_apis
            arch: x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Enable hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run installed-APK tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: sh gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-results-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore

  docs:
    name: Docs unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  docs-browser:
    name: Docs browser E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run QR browser tests
        run: pnpm test:e2e

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-results
          path: |
            docs/playwright-report/
            docs/test-results/
          if-no-files-found: ignore
